<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100">
  <defs>
    <radialGradient id="vellum" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="100%" stop-color="#c8a96e"/>
    </radialGradient>
    <radialGradient id="gearGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b6914"/>
      <stop offset="100%" stop-color="#3d2b00"/>
    </radialGradient>
    <filter id="aged">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background vellum -->
  <rect width="800" height="1100" fill="url(#vellum)" filter="url(#aged)"/>
  
  <!-- Border frame — double rule -->
  <rect x="20" y="20" width="760" height="1060" fill="none" stroke="#6b4c11" stroke-width="3"/>
  <rect x="28" y="28" width="744" height="1044" fill="none" stroke="#6b4c11" stroke-width="1"/>

  <!-- Top decorative band -->
  <rect x="20" y="20" width="760" height="80" fill="#6b4c11" opacity="0.15"/>
  
  <!-- Archive mark top -->
  <text x="400" y="65" font-family="Georgia, serif" font-size="13" fill="#3d2b00" text-anchor="middle" letter-spacing="4">DA VALENCA ARCHIVE</text>

  <!-- Central gear assembly -->
  <!-- Main outer gear -->
  <circle cx="400" cy="420" r="180" fill="none" stroke="#6b4c11" stroke-width="8"/>
  <circle cx="400" cy="420" r="165" fill="none" stroke="#6b4c11" stroke-width="2"/>
  <!-- Gear teeth outer -->
  <g fill="#6b4c11" opacity="0.7">
    <rect x="393" y="232" width="14" height="22" rx="2"/>
    <rect x="393" y="575" width="14" height="22" rx="2" transform="rotate(180 400 420)"/>
    <rect x="571" y="413" width="22" height="14" rx="2"/>
    <rect x="208" y="413" width="22" height="14" rx="2"/>
    <!-- Diagonal teeth -->
    <rect x="523" y="270" width="14" height="22" rx="2" transform="rotate(45 400 420)"/>
    <rect x="523" y="270" width="14" height="22" rx="2" transform="rotate(90 400 420)"/>
    <rect x="523" y="270" width="14" height="22" rx="2" transform="rotate(135 400 420)"/>
    <rect x="523" y="270" width="14" height="22" rx="2" transform="rotate(225 400 420)"/>
    <rect x="523" y="270" width="14" height="22" rx="2" transform="rotate(270 400 420)"/>
    <rect x="523" y="270" width="14" height="22" rx="2" transform="rotate(315 400 420)"/>
  </g>
  <!-- Inner gear rings -->
  <circle cx="400" cy="420" r="140" fill="#f5e6c8" stroke="#6b4c11" stroke-width="4" opacity="0.6"/>
  <circle cx="400" cy="420" r="90" fill="none" stroke="#6b4c11" stroke-width="6"/>
  <circle cx="400" cy="420" r="70" fill="#e8d5a3" stroke="#6b4c11" stroke-width="2"/>
  <!-- Cross spokes -->
  <line x1="400" y1="340" x2="400" y2="500" stroke="#6b4c11" stroke-width="5"/>
  <line x1="320" y1="420" x2="480" y2="420" stroke="#6b4c11" stroke-width="5"/>
  <line x1="343" y1="363" x2="457" y2="477" stroke="#6b4c11" stroke-width="3"/>
  <line x1="457" y1="363" x2="343" y2="477" stroke="#6b4c11" stroke-width="3"/>
  <!-- Centre hub -->
  <circle cx="400" cy="420" r="30" fill="#6b4c11"/>
  <circle cx="400" cy="420" r="15" fill="#f5e6c8"/>
  <circle cx="400" cy="420" r="6" fill="#6b4c11"/>

  <!-- Small secondary gears -->
  <circle cx="220" cy="280" r="55" fill="none" stroke="#6b4c11" stroke-width="4" opacity="0.5"/>
  <circle cx="220" cy="280" r="38" fill="#e8d5a3" stroke="#6b4c11" stroke-width="2" opacity="0.5"/>
  <circle cx="220" cy="280" r="12" fill="#6b4c11" opacity="0.5"/>
  
  <circle cx="580" cy="280" r="45" fill="none" stroke="#6b4c11" stroke-width="4" opacity="0.5"/>
  <circle cx="580" cy="280" r="30" fill="#e8d5a3" stroke="#6b4c11" stroke-width="2" opacity="0.5"/>
  <circle cx="580" cy="280" r="10" fill="#6b4c11" opacity="0.5"/>

  <!-- Shaft lines -->
  <line x1="100" y1="420" x2="700" y2="420" stroke="#6b4c11" stroke-width="3" stroke-dasharray="8,4" opacity="0.4"/>
  <line x1="400" y1="100" x2="400" y2="700" stroke="#6b4c11" stroke-width="2" stroke-dasharray="6,4" opacity="0.3"/>

  <!-- Vitruvian circle ghost -->
  <circle cx="400" cy="420" r="200" fill="none" stroke="#6b4c11" stroke-width="1" stroke-dasharray="4,8" opacity="0.3"/>

  <!-- Title block -->
  <line x1="60" y1="640" x2="740" y2="640" stroke="#6b4c11" stroke-width="2"/>
  
  <text x="400" y="690" font-family="Georgia, serif" font-size="42" fill="#3d2b00" text-anchor="middle" font-weight="bold">DA VINCI</text>
  <text x="400" y="740" font-family="Georgia, serif" font-size="52" fill="#3d2b00" text-anchor="middle" font-weight="bold">MECHANICA</text>
  
  <line x1="60" y1="760" x2="740" y2="760" stroke="#6b4c11" stroke-width="1"/>
  
  <text x="400" y="800" font-family="Georgia, serif" font-size="16" fill="#6b4c11" text-anchor="middle" font-style="italic">Madrid Codex I — Systematic Mechanical Reconstruction</text>
  <text x="400" y="830" font-family="Georgia, serif" font-size="14" fill="#6b4c11" text-anchor="middle" letter-spacing="2">Corpus Leonardianum Universale</text>

  <!-- Author block -->
  <line x1="200" y1="900" x2="600" y2="900" stroke="#6b4c11" stroke-width="1" opacity="0.5"/>
  <text x="400" y="935" font-family="Georgia, serif" font-size="15" fill="#3d2b00" text-anchor="middle">Richard Steven Vallance</text>
  <text x="400" y="958" font-family="Georgia, serif" font-size="12" fill="#6b4c11" text-anchor="middle">The People Focused Group · Doncaster, UK</text>
  <text x="400" y="978" font-family="Georgia, serif" font-size="12" fill="#6b4c11" text-anchor="middle">2026</text>

  <!-- Bottom rule -->
  <rect x="20" y="1010" width="760" height="70" fill="#6b4c11" opacity="0.1"/>
  <text x="400" y="1052" font-family="Georgia, serif" font-size="11" fill="#3d2b00" text-anchor="middle" letter-spacing="3">© 2026 RICHARD STEVEN VALLANCE · ALL RIGHTS RESERVED</text>
</svg>
