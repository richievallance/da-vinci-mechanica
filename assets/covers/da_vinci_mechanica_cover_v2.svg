<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 960" width="680" height="960">
  <defs>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="ink">
      <feGaussianBlur stdDeviation="0.3"/>
    </filter>
    <radialGradient id="vellum" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FBF5E6"/>
      <stop offset="100%" stop-color="#E8DEC8"/>
    </radialGradient>
    <linearGradient id="goldbar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#6B4F0E"/>
    </linearGradient>
  </defs>
  <!-- Vellum ground -->
  <rect width="680" height="960" fill="url(#vellum)"/>
  <!-- Aged texture overlay -->
  <rect width="680" height="960" fill="#C8AA7A" opacity="0.08"/>
  <!-- Foxing spots -->
  <circle cx="45" cy="80" r="3" fill="#8B6914" opacity="0.12"/>
  <circle cx="630" cy="150" r="4" fill="#8B6914" opacity="0.08"/>
  <circle cx="590" cy="820" r="3" fill="#5C3D1E" opacity="0.10"/>
  <circle cx="80" cy="750" r="5" fill="#8B6914" opacity="0.07"/>
  <circle cx="340" cy="900" r="2" fill="#5C3D1E" opacity="0.09"/>
  <!-- ═══ MAIN GEAR ASSEMBLY ═══ -->
  <!-- Central large gear -->
  <g transform="translate(340,480)" filter="url(#ink)">
    <!-- Gear body -->
    <circle r="140" fill="none" stroke="#5C3D1E" stroke-width="2.5" opacity="0.85"/>
    <circle r="120" fill="none" stroke="#5C3D1E" stroke-width="1" opacity="0.4"/>
    <circle r="30" fill="none" stroke="#5C3D1E" stroke-width="2" opacity="0.8"/>
    <circle r="8" fill="#5C3D1E" opacity="0.7"/>
    <!-- Gear teeth — 16 teeth -->
    <g stroke="#5C3D1E" stroke-width="2" fill="none" opacity="0.82">
      <rect x="-8" y="-155" width="16" height="22" rx="1"/>
      <rect x="-8" y="133" width="16" height="22" rx="1"/>
      <rect x="-155" y="-8" width="22" height="16" rx="1"/>
      <rect x="133" y="-8" width="22" height="16" rx="1"/>
      <g transform="rotate(22.5)"><rect x="-8" y="-155" width="16" height="22" rx="1"/></g>
      <g transform="rotate(45)"><rect x="-8" y="-155" width="16" height="22" rx="1"/></g>
      <g transform="rotate(67.5)"><rect x="-8" y="-155" width="16" height="22" rx="1"/></g>
      <g transform="rotate(112.5)"><rect x="-8" y="-155" width="16" height="22" rx="1"/></g>
      <g transform="rotate(135)"><rect x="-8" y="-155" width="16" height="22" rx="1"/></g>
      <g transform="rotate(157.5)"><rect x="-8" y="-155" width="16" height="22" rx="1"/></g>
      <g transform="rotate(202.5)"><rect x="-8" y="-155" width="16" height="22" rx="1"/></g>
      <g transform="rotate(225)"><rect x="-8" y="-155" width="16" height="22" rx="1"/></g>
      <g transform="rotate(247.5)"><rect x="-8" y="-155" width="16" height="22" rx="1"/></g>
      <g transform="rotate(292.5)"><rect x="-8" y="-155" width="16" height="22" rx="1"/></g>
      <g transform="rotate(315)"><rect x="-8" y="-155" width="16" height="22" rx="1"/></g>
      <g transform="rotate(337.5)"><rect x="-8" y="-155" width="16" height="22" rx="1"/></g>
    </g>
    <!-- Spoke arms -->
    <g stroke="#5C3D1E" stroke-width="1.5" opacity="0.65">
      <line x1="0" y1="-30" x2="0" y2="-120"/>
      <line x1="0" y1="30" x2="0" y2="120"/>
      <line x1="-30" y1="0" x2="-120" y2="0"/>
      <line x1="30" y1="0" x2="120" y2="0"/>
      <line x1="-21" y1="-21" x2="-85" y2="-85"/>
      <line x1="21" y1="-21" x2="85" y2="-85"/>
      <line x1="-21" y1="21" x2="-85" y2="85"/>
      <line x1="21" y1="21" x2="85" y2="85"/>
    </g>
    <!-- Proportional ratio lines -->
    <line x1="-170" y1="0" x2="170" y2="0" stroke="#5C3D1E" stroke-width="0.5" stroke-dasharray="3,4" opacity="0.35"/>
    <line x1="0" y1="-170" x2="0" y2="170" stroke="#5C3D1E" stroke-width="0.5" stroke-dasharray="3,4" opacity="0.35"/>
  </g>
  <!-- Small companion gear upper right -->
  <g transform="translate(520,310)" opacity="0.7">
    <circle r="62" fill="none" stroke="#5C3D1E" stroke-width="1.8"/>
    <circle r="12" fill="none" stroke="#5C3D1E" stroke-width="1.5"/>
    <circle r="4" fill="#5C3D1E"/>
    <g stroke="#5C3D1E" stroke-width="1.5" fill="none">
      <rect x="-5" y="-68" width="10" height="14" rx="1"/>
      <rect x="-5" y="54" width="10" height="14" rx="1"/>
      <rect x="-68" y="-5" width="14" height="10" rx="1"/>
      <rect x="54" y="-5" width="14" height="10" rx="1"/>
      <g transform="rotate(45)"><rect x="-5" y="-68" width="10" height="14" rx="1"/></g>
      <g transform="rotate(90)"><rect x="-5" y="-68" width="10" height="14" rx="1"/></g>
      <g transform="rotate(135)"><rect x="-5" y="-68" width="10" height="14" rx="1"/></g>
      <g transform="rotate(225)"><rect x="-5" y="-68" width="10" height="14" rx="1"/></g>
      <g transform="rotate(270)"><rect x="-5" y="-68" width="10" height="14" rx="1"/></g>
      <g transform="rotate(315)"><rect x="-5" y="-68" width="10" height="14" rx="1"/></g>
    </g>
    <g stroke="#5C3D1E" stroke-width="1" opacity="0.55">
      <line x1="0" y1="-12" x2="0" y2="-60"/>
      <line x1="0" y1="12" x2="0" y2="60"/>
      <line x1="-12" y1="0" x2="-60" y2="0"/>
      <line x1="12" y1="0" x2="60" y2="0"/>
    </g>
  </g>
  <!-- Worm drive shaft lower left -->
  <g transform="translate(155,630)" opacity="0.6">
    <rect x="-45" y="-12" width="90" height="24" rx="4" fill="none" stroke="#5C3D1E" stroke-width="1.5"/>
    <line x1="-35" y1="-12" x2="-35" y2="12" stroke="#5C3D1E" stroke-width="1"/>
    <line x1="-20" y1="-12" x2="-20" y2="12" stroke="#5C3D1E" stroke-width="1"/>
    <line x1="-5" y1="-12" x2="-5" y2="12" stroke="#5C3D1E" stroke-width="1"/>
    <line x1="10" y1="-12" x2="10" y2="12" stroke="#5C3D1E" stroke-width="1"/>
    <line x1="25" y1="-12" x2="25" y2="12" stroke="#5C3D1E" stroke-width="1"/>
    <line x1="40" y1="-12" x2="40" y2="12" stroke="#5C3D1E" stroke-width="1"/>
    <!-- Shaft line -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#5C3D1E" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.5"/>
  </g>
  <!-- Vitruvian geometry ghost — circle and square -->
  <g opacity="0.07" stroke="#5C3D1E" fill="none" stroke-width="1">
    <circle cx="340" cy="480" r="260"/>
    <rect x="110" y="250" width="460" height="460"/>
  </g>
  <!-- Marginal annotation lines — left margin -->
  <g opacity="0.3" stroke="#5C3D1E" stroke-width="0.8">
    <line x1="55" y1="320" x2="160" y2="320"/>
    <line x1="55" y1="340" x2="145" y2="340"/>
    <line x1="55" y1="360" x2="155" y2="360"/>
    <line x1="55" y1="380" x2="130" y2="380"/>
    <line x1="55" y1="420" x2="150" y2="420"/>
    <line x1="55" y1="440" x2="140" y2="440"/>
    <line x1="55" y1="460" x2="148" y2="460"/>
    <!-- proportion arrows -->
    <line x1="60" y1="530" x2="90" y2="530" marker-end="url(#arr)"/>
    <line x1="60" y1="560" x2="85" y2="560"/>
    <line x1="60" y1="590" x2="92" y2="590"/>
  </g>
  <!-- Right margin ratio annotations -->
  <g opacity="0.28" stroke="#5C3D1E" stroke-width="0.8">
    <line x1="540" y1="400" x2="625" y2="400"/>
    <line x1="540" y1="420" x2="618" y2="420"/>
    <line x1="540" y1="440" x2="622" y2="440"/>
    <line x1="540" y1="460" x2="610" y2="460"/>
  </g>
  <!-- ═══ GOLD TITLE BAR ═══ -->
  <rect x="0" y="0" width="680" height="140" fill="url(#goldbar)"/>
  <rect x="0" y="136" width="680" height="4" fill="#4A3008"/>
  <rect x="0" y="137" width="680" height="1" fill="#C9A84C" opacity="0.4"/>
  <!-- Title text -->
  <text x="340" y="58" font-family="Georgia, serif" font-size="32" font-weight="bold"
        fill="#FAF0DC" text-anchor="middle" letter-spacing="4">DA VALENCA</text>
  <text x="340" y="92" font-family="Georgia, serif" font-size="22" font-weight="bold"
        fill="#FAF0DC" text-anchor="middle" letter-spacing="6">MECHANICA</text>
  <line x1="60" y1="106" x2="620" y2="106" stroke="#C9A84C" stroke-width="0.8" opacity="0.6"/>
  <text x="340" y="124" font-family="Georgia, serif" font-size="11" font-style="italic"
        fill="#E8D4A0" text-anchor="middle" letter-spacing="1.5">Madrid Codex I — Engineering Reconstruction</text>
  <!-- ═══ BOTTOM AUTHOR BAR ═══ -->
  <rect x="0" y="900" width="680" height="60" fill="#3D2410" opacity="0.9"/>
  <line x1="0" y1="900" x2="680" y2="900" stroke="#C9A84C" stroke-width="1"/>
  <text x="340" y="926" font-family="Georgia, serif" font-size="11"
        fill="#C9A84C" text-anchor="middle" letter-spacing="2">RICHARD STEVEN VALLANCE (DA VALENCA)</text>
  <text x="340" y="948" font-family="Georgia, serif" font-size="9"
        fill="#A08040" text-anchor="middle" letter-spacing="1">The People Focused Group · Doncaster, UK · 2026</text>
  <!-- Evidence tier stamp -->
  <rect x="24" y="855" width="120" height="34" rx="3" fill="none" stroke="#8B6914" stroke-width="1" opacity="0.6"/>
  <text x="84" y="869" font-family="Georgia, serif" font-size="8" fill="#8B6914" text-anchor="middle" opacity="0.7">TIER A/B CLAIMS</text>
  <text x="84" y="882" font-family="Georgia, serif" font-size="7" fill="#8B6914" text-anchor="middle" opacity="0.6">PRE-PUBLICATION</text>
</svg>